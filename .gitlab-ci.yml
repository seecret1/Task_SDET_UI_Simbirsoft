image: maven:3.9.4-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository/
    - target/

stages:
  - test
  - security
  - quality
  - deploy

before_script:
  - apt-get update
  - apt-get install -y wget unzip
  - wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
  - echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list
  - apt-get update
  - apt-get install -y google-chrome-stable

test:
  stage: test
  script:
    - mvn clean test -Pci
  artifacts:
    paths:
      - target/allure-results/
      - target/surefire-reports/
    when: always
    expire_in: 1 week

allure-report:
  stage: test
  script:
    - mvn allure:report -Pci
  artifacts:
    paths:
      - target/allure-report/
    expire_in: 1 week
  dependencies:
    - test

security-scan:
  stage: security
  script:
    - mvn org.owasp:dependency-check-maven:check -Pci
  artifacts:
    paths:
      - target/security-report/
    expire_in: 4 weeks
  dependencies:
    - test

coverage:
  stage: quality
  script:
    - mvn clean test jacoco:report -Pci
    - mvn jacoco:check
  artifacts:
    paths:
      - target/site/jacoco/
    expire_in: 1 week

pages:
  stage: deploy
  script:
    - mvn clean site javadoc:javadoc -Pci
    - mkdir public
    - cp -r target/site/* public/
  artifacts:
    paths:
      - public
  only:
    - main
    - master